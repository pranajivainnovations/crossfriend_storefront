version: '3.8'

services:
  crossfriend-storefront:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # THIS is the one that decides canonical URLs — build args are baked in by the bundler.
        # Changing it requires a rebuild (`docker compose up -d --build`); `up` alone reuses the
        # existing image and silently keeps the old value.
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://crossfriend.in}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-in}
    image: crossfriend-storefront:latest
    container_name: crossfriend-storefront
    ports:
      - "8000:8000"
    environment:
      # Runtime environment variables — Medusa URL is ONLY set here (or .env)
      NODE_ENV: production
      PORT: 8000
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://localhost:9001}
      # Kept only so the value is visible when inspecting a running container. It has NO effect on
      # rendered URLs — that was verified by building with one value and starting with another:
      # the build-time value won. Do not expect changing this line to fix a canonical.
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://crossfriend.in}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-in}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - crossfriend-network

networks:
  crossfriend-network:
    driver: bridge
