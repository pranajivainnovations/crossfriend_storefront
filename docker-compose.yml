version: '3.8'

services:
  crossfriend-storefront:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time environment variables (NEXT_PUBLIC_* are baked into client JS).
        # Every one of these must also be declared as an ARG in the Dockerfile's builder stage —
        # Docker silently ignores a build arg the Dockerfile does not declare.
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-https://api.pranajiva.in}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://crossfriend.in}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-in}
        # Defaults to the real production property, like the two above.
        #
        # NOTE: production does not build from this file. deploy.sh builds the image locally with
        # explicit --build-arg flags and ships only the image; the server's compose file is used
        # for `up`, never for `build`. So the authoritative place for this value is deploy.sh, and
        # the Dockerfile's ARG default behind it. This line only covers `docker compose build`,
        # which is the local path.
        #
        # A GA4 measurement ID is not a secret — it is inlined into the client bundle and readable
        # by anyone who opens DevTools. Hardcoding the production value here is the same call the
        # repo already makes for the base URL, and for the same reason: an empty value fails
        # silently, and silence is what cost two deploys.
        #
        # Override with `NEXT_PUBLIC_GA_MEASUREMENT_ID= docker compose build` to build without it.
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-G-PGF5L9QMCQ}
    image: crossfriend-storefront:latest
    container_name: crossfriend-storefront
    ports:
      - "8000:8000"
    environment:
      # Runtime environment variables
      NODE_ENV: production
      PORT: 8000
      # Server-side URL (container → host) for SSR
      MEDUSA_BACKEND_URL: https://api.pranajiva.in
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-https://api.pranajiva.in}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://crossfriend.in}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-in}

      # ── OTP sign-in ─────────────────────────────────────────────────────────
      # Salt for the derived Medusa password behind mobile sign-in.
      #
      # This one genuinely belongs here, unlike the NEXT_PUBLIC_* values above.
      # It has no NEXT_PUBLIC_ prefix, so the bundler never inlines it and the
      # /api/auth/otp/verify route reads it from process.env per request — a
      # value set here takes effect on `up -d`, with no rebuild. Adding it as a
      # build arg instead would bake a secret into the image and still not be
      # read at runtime, which is the worst of both.
      #
      # Deliberately no `:-default`. Compose turns an absent ${VAR} into an
      # empty string, and the route treats empty as fatal (503) rather than
      # falling back — the previous hardcoded fallback shipped to production and
      # made every customer's password derivable from the source.
      #
      # Once set, do not change it: every existing customer's password is
      # derived from this value.
      OTP_PASSWORD_SALT: ${OTP_PASSWORD_SALT}

      # ── Browser notifications ───────────────────────────────────────────────
      # The PUBLIC half of the VAPID pair only. The private key lives in OPS,
      # which is what actually sends; the storefront needs this solely so a
      # browser can subscribe.
      #
      # No NEXT_PUBLIC_ prefix on purpose, even though the value reaches the
      # browser. NEXT_PUBLIC_* is inlined at build time inside the Docker
      # builder stage, so it would have to be a build arg — and a missing one
      # builds cleanly and fails silently at runtime. A server action reads this
      # per request instead, so setting it here takes effect on `up -d`.
      #
      # Leave it unset and the opt-in card simply never renders. Nothing else
      # on the site changes.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://crossfriend.in"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - crossfriend-network

networks:
  crossfriend-network:
    driver: bridge
